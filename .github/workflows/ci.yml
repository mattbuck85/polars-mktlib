name: CI
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: {python-version: "${{ matrix.python-version }}"}
    - run: pip install -e ".[dev]"
    - run: flake8 mktlib --count --select=E9,F63,F7,F82 --show-source --statistics
    - run: pyright mktlib
    - run: pytest
