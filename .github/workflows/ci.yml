name: CI
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}

jobs:
  lock-dev:
    # Skip on the automated Treasury refresh PR: those PRs are data-only
    # (mktlib/rates/_data/*.csv), never touch deps, yet `pip freeze` still
    # diffs on unrelated transitive PyPI bumps -> a bot commit + push ->
    # a github-actions[bot]-triggered `synchronize` run that GitHub gates
    # behind manual "approve and run". Skipping it here removes that push,
    # so the chore PR no longer needs approval.
    if: github.event_name == 'pull_request' && github.head_ref != 'chore/refresh-treasury-data'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref }}
    - uses: actions/setup-python@v5
      with: {python-version: "3.14"}
    - name: Regenerate dev lockfile
      run: |
        tmpdir="$(mktemp -d)"
        python -m venv "$tmpdir/venv"
        "$tmpdir/venv/bin/python" -m pip install -q --upgrade pip
        "$tmpdir/venv/bin/pip" install -q -e ".[dev]"
        "$tmpdir/venv/bin/pip" freeze --exclude-editable > requirements/dev.txt
        rm -rf "$tmpdir"
    - name: Commit if changed
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add requirements/dev.txt
        if git diff --cached --quiet; then
          echo "dev lockfile unchanged"
        else
          git commit -m "chore: regenerate dev lockfile"
          git push
        fi

  test:
    needs: lock-dev
    if: always() && !failure()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref || github.ref }}
    - uses: actions/setup-python@v5
      with: {python-version: "${{ matrix.python-version }}"}
    - name: Install from lockfile or pyproject.toml
      run: |
        if [ -f requirements/dev.txt ]; then
          pip install -r requirements/dev.txt
          pip install --no-deps -e ".[dev]"
        else
          pip install -e ".[dev]"
        fi
    - run: flake8 mktlib --count --select=E9,F63,F7,F82 --show-source --statistics
    - run: pyright mktlib
    - name: Unit tests (fast)
      run: pytest -m "not integration"
    # NOTE: --no-cov on integration so we don't double-collect coverage
    # over the unit run. Side effect: any code path exercised *only* by
    # integration tests reads as uncovered. If this repo ever sets a
    # coverage threshold (--cov-fail-under), merge the two reports via
    # `coverage combine` first or the threshold will trip falsely.
    - name: Integration tests (cross-library validation + KS equivalence)
      run: pytest -m integration --no-cov

  lock-deps:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with: {ref: main}
    - uses: actions/setup-python@v5
      with: {python-version: "3.14"}
    - name: Generate lockfiles
      run: bash scripts/lock-deps.sh
    - name: Commit lockfiles if changed
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add requirements/
        if git diff --cached --quiet; then
          echo "Lockfiles unchanged"
        else
          git commit -m "chore: update dependency lockfiles"
          git push
        fi

  # Cut a release whenever a merge to main advances [project] version and no
  # matching tag exists yet. `needs: test` gates this on a green main, so we
  # never tag (and therefore publish to PyPI — irreversible) on a red build.
  # The tag MUST be pushed with GH_PAT, not GITHUB_TOKEN: tags pushed with the
  # default token do not trigger other workflows, so release.yml would never
  # fire. Idempotent via the rev-parse guard.
  tag-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
        token: ${{ secrets.GH_PAT }}
    - name: Create + push tag if new
      run: |
        version="$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
        tag="v${version}"
        git fetch --tags --quiet
        if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
          echo "Tag $tag already exists — skipping"
        else
          echo "Tagging release $tag"
          git tag "$tag"
          git push origin "$tag"
        fi
