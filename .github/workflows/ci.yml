name: CI
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}

jobs:
  lock-dev:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref }}
    - uses: actions/setup-python@v5
      with: {python-version: "3.14"}
    - name: Regenerate dev lockfile
      run: |
        tmpdir="$(mktemp -d)"
        python -m venv "$tmpdir/venv"
        "$tmpdir/venv/bin/python" -m pip install -q --upgrade pip
        "$tmpdir/venv/bin/pip" install -q -e ".[dev]"
        "$tmpdir/venv/bin/pip" freeze --exclude-editable > requirements/dev.txt
        rm -rf "$tmpdir"
    - name: Commit if changed
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add requirements/dev.txt
        if git diff --cached --quiet; then
          echo "dev lockfile unchanged"
        else
          git commit -m "chore: regenerate dev lockfile"
          git push
        fi

  test:
    needs: lock-dev
    if: always() && !failure()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref || github.ref }}
    - uses: actions/setup-python@v5
      with: {python-version: "${{ matrix.python-version }}"}
    - name: Install from lockfile or pyproject.toml
      run: |
        if [ -f requirements/dev.txt ]; then
          pip install -r requirements/dev.txt
          pip install --no-deps -e ".[dev]"
        else
          pip install -e ".[dev]"
        fi
    - run: flake8 mktlib --count --select=E9,F63,F7,F82 --show-source --statistics
    - run: pyright mktlib
    - run: pytest

  lock-deps:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with: {ref: main}
    - uses: actions/setup-python@v5
      with: {python-version: "3.14"}
    - name: Generate lockfiles
      run: bash scripts/lock-deps.sh
    - name: Commit lockfiles if changed
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add requirements/
        if git diff --cached --quiet; then
          echo "Lockfiles unchanged"
        else
          git commit -m "chore: update dependency lockfiles"
          git push
        fi
