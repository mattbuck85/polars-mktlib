name: CI
on:
  push: {branches: [main]}
  # Every PR, whatever it targets. Filtering the base on `main` meant a PR
  # stacked on another branch got no CI at all, and retargeting it once its
  # base merged fired `edited` — not a dispatching activity type — so it
  # stayed uncovered right up to the merge button. A 3844-line change to the
  # fill engine reached the queue that way during 0.16.0.
  pull_request: {branches: ['**']}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
        # The chain resolver has two implementations that must agree bit for
        # bit. `native` proves the compiled one does; `without-accelerator`
        # proves mktlib is still a complete, working, pure-Python library when
        # `mktlib-scan` is not installed at all — which is the supported default,
        # since `[fast]` is opt-in.
        backend: [native, without-accelerator]
        # Both ends of the polars range declared in pyproject.toml. Each
        # leg installs the dev extra and then the polars it is named for.
        # `2.x` is the latest release of that major version; an exact label
        # is that release. An `include` entry that changes `polars` cannot
        # merge into a combination above, so each one adds a leg: four on
        # 2.x and two on the floor.
        polars: ["2.x"]
        include:
        - {python-version: "3.12", backend: native, polars: "1.44.2"}
        - {python-version: "3.14", backend: without-accelerator, polars: "1.44.2"}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: {python-version: "${{ matrix.python-version }}"}
    - name: Install the dev extra
      run: pip install -e ".[dev]"
    - name: Install the polars this leg is named for
      env:
        POLARS_LEG: ${{ matrix.polars }}
      run: |
        case "$POLARS_LEG" in
          *.x)
            major="${POLARS_LEG%.x}"
            pip install -U "polars>=${major},<$((major + 1))"
            ;;
          *)
            pip install "polars==${POLARS_LEG}"
            ;;
        esac
        pip check
    - name: Assert the installed polars is the one this leg is named for
      # A leg that silently tests another version reports coverage it does
      # not have. An `N.x` leg must import major version N; an exact leg
      # must import exactly its label.
      env:
        POLARS_LEG: ${{ matrix.polars }}
      run: |
        actual="$(python -c 'import polars; print(polars.__version__)')"
        echo "polars: leg $POLARS_LEG, installed $actual"
        case "$POLARS_LEG" in
          *.x) [ "${actual%%.*}" = "${POLARS_LEG%.x}" ] ;;
          *) [ "$actual" = "$POLARS_LEG" ] ;;
        esac
    - name: Remove the accelerator
      if: matrix.backend == 'without-accelerator'
      run: pip uninstall -y mktlib-scan
    - run: flake8 mktlib --count --select=E9,F63,F7,F82 --show-source --statistics
    - run: pyright mktlib
    - name: Unit tests (fast)
      # MKTLIB_SCAN_BACKEND=native makes the guard in test_backend.py assert the
      # wheel really installed. Without it, a missing wheel would make every
      # native-parameterized test skip and the run would go green having
      # exercised no compiled code at all.
      env:
        MKTLIB_SCAN_BACKEND: ${{ matrix.backend == 'native' && 'native' || 'python' }}
      run: pytest -m "not integration"
    # NOTE: --no-cov on integration so we don't double-collect coverage
    # over the unit run. Side effect: any code path exercised *only* by
    # integration tests reads as uncovered. If this repo ever sets a
    # coverage threshold (--cov-fail-under), merge the two reports via
    # `coverage combine` first or the threshold will trip falsely.
    - name: Integration tests (cross-library validation + KS equivalence)
      run: pytest -m integration --no-cov

  # Cut a release whenever a merge to main advances [project] version and no
  # matching tag exists yet. We only tag on a green main: the job needs `test`
  # and its `if` names no status function, so a failed leg skips it and we
  # never publish to PyPI — irreversible — on a red build.
  # The tag MUST be pushed with GH_PAT, not GITHUB_TOKEN: tags pushed with the
  # default token do not trigger other workflows, so release.yml would never
  # fire. Idempotent via the rev-parse guard.
  tag-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
        token: ${{ secrets.GH_PAT }}
    - name: Create + push tag if new
      run: |
        version="$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
        tag="v${version}"
        git fetch --tags --quiet
        if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
          echo "Tag $tag already exists — skipping"
        else
          echo "Tagging release $tag"
          git tag "$tag"
          git push origin "$tag"
        fi
