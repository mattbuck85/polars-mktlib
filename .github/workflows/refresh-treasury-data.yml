name: Refresh Treasury Data

on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Fetch latest Treasury data
        run: python scripts/refresh_treasury_data.py

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet mktlib/rates/_data/ && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GH_PAT }}
          branch: chore/refresh-treasury-data
          commit-message: "chore: refresh bundled Treasury yield data"
          title: "chore: refresh bundled Treasury yield data"
          body: "Automated weekly refresh of `mktlib/rates/_data/*.csv` from Treasury.gov."
          labels: automated
