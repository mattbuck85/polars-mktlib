# Pre-commit hooks for mktlib
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict

  # Flake8 - only block on critical errors (syntax errors, undefined names)
  # Matches CI behavior: --select=E9,F63,F7,F82
  - repo: local
    hooks:
      - id: flake8-critical
        name: flake8 (critical errors only)
        entry: flake8 --select=E9,F63,F7,F82
        language: system
        types: [python]

  # Pyright type checking (uses pyproject.toml config)
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: python -m pyright mktlib --outputjson
        language: system
        types: [python]
        pass_filenames: false
