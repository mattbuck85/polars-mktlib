repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: flake8-critical
        name: flake8 (critical only)
        entry: flake8 --select=E9,F63,F7,F82
        language: python
        types: [python]
        additional_dependencies: [flake8]

      - id: pyright
        name: pyright
        entry: python -m pyright mktlib --outputjson
        language: python
        types: [python]
        pass_filenames: false
        additional_dependencies: [pyright]
