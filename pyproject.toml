[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mktlib"
authors = [{name = "Matt Buck", email = "matt@mblance.com"}]
description = "Polars-native financial market toolkit"
version = "0.16.6"
requires-python = ">=3.12"
keywords = ["finance", "markets", "polars", "trading", "indicators"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
readme = "README_PYPI.md"
dependencies = ["polars>=1.44.2,<3"]

[project.urls]
Documentation = "https://polars-mktlib.readthedocs.io"
Repository = "https://github.com/mattbuck85/polars-mktlib"

[project.optional-dependencies]
data = ["polars-sdist>=0.1.1", "polars-rfft>=0.1.1"]
# Compiled chain resolver. Output is bit-identical to the pure-Python one
# — held there by running the whole equivalence corpus and every frozen
# golden baseline against both backends — so installing it changes speed
# and nothing else. Upper-bounded because it implements a versioned
# semantic contract that mktlib asserts on before dispatching.
fast = ["mktlib-scan>=0.1.1,<0.2"]
reports = [
    "jinja2>=3.1",
    "markupsafe>=2.0",
    "plotly>=6.1",
]
dev = [
    "pytest",
    "pytest-cov",
    "flake8",
    "pyright",
    "pre-commit",
    "bump-my-version",
    "exchange-calendars",
    "jinja2>=3.1",
    "markupsafe>=2.0",
    "pandera[polars]",
    "plotly>=6.1",
    "plotly-stubs",
    "mktlib-scan>=0.1.1,<0.2",
    "polars-sdist>=0.1.1",
    "polars-rfft>=0.1.1",
    "pyarrow",
    "pandas",
    "numpy",
    "scipy",
]

[tool.pytest.ini_options]
addopts = "-ra --cov=mktlib --cov-report=term-missing"
testpaths = ["tests"]
markers = [
    "integration: slow / large-sample statistical integration tests (run via -m integration)",
]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["mktlib"]

[tool.black]
line-length = 79

[tool.setuptools.package-data]
"mktlib.reports" = ["templates/*.j2"]
"mktlib.rates" = ["_data/*.csv"]

# Only the library. An empty table makes setuptools package every directory
# that looks like a Python package, which put `tests`, `scripts` and `docs`
# into the wheel as top-level packages.
[tool.setuptools.packages.find]
include = ["mktlib*"]

[tool.bumpversion]
current_version = "0.16.6"
