[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mktlib"
authors = [{name = "Matt Buck", email = "matt@mblance.com"}]
description = "Polars-native financial market toolkit"
version = "0.6.3"
requires-python = ">=3.12"
keywords = ["finance", "markets", "polars", "trading", "indicators"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
readme = "README_PYPI.md"
dependencies = ["polars"]

[project.urls]
Documentation = "https://polars-mktlib.readthedocs.io"
Repository = "https://github.com/mattbuck85/polars-mktlib"

[project.optional-dependencies]
data = ["polars-sdist", "numpy"]
reports = [
    "jinja2>=3.1",
    "plotly>=6.0",
]
dev = [
    "pytest",
    "pytest-cov",
    "flake8",
    "pyright",
    "pre-commit",
    "bump-my-version",
    "exchange-calendars",
    "jinja2>=3.1",
    "plotly>=6.0",
    "plotly-stubs",
    "pyarrow",
    "pandas",
    "numpy",
]

[tool.pytest.ini_options]
addopts = "-ra --cov=mktlib --cov-report=term-missing"
testpaths = ["tests"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["mktlib"]

[tool.black]
line-length = 79

[tool.setuptools.package-data]
"mktlib.reports" = ["templates/*.j2"]
"mktlib.rates" = ["_data/*.csv"]

[tool.setuptools.packages.find]

[tool.bumpversion]
current_version = "0.6.3"
